<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">FinSolve RAG workflow</title>
  <desc id="description">Documents are ingested, chunked, embedded and indexed. User questions travel through the interface and API to role-filtered retrieval and Groq answer generation, with cited answers returned.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="458" rx="24" fill="url(#canvas)" stroke="#dbeafe"/>
  <text x="48" y="53" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">From trusted documents to cited answers</text>
  <text x="48" y="80" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="14">Index your documents once, then retrieve only what each role is allowed to see.</text>
  <text x="48" y="116" fill="#0f766e" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">DOCUMENT INDEXING</text>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M190 170h139"/>
    <path d="M490 170h139"/>
    <path d="M790 170h139"/>
    <path d="M190 341h139"/>
    <path d="M490 341h139"/>
    <path d="M790 341h139"/>
    <path d="M1005 214v36h-600v35"/>
  </g>
  <text x="48" y="250" fill="#1d4ed8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">QUESTION &amp; ANSWER</text>
  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(45 128)">
      <rect width="145" height="84" rx="16" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="26" cy="26" r="14" fill="#dbeafe"/>
      <path d="M21 19h10v14H21zM23 23h6M23 27h6" fill="none" stroke="#2563eb" stroke-width="1.5"/>
      <text x="20" y="60" fill="#0f172a" font-size="15" font-weight="700">Documents</text>
      <text x="20" y="76" fill="#64748b" font-size="12">Markdown by department</text>
    </g>
    <g transform="translate(345 128)">
      <rect width="145" height="84" rx="16" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="26" cy="26" r="14" fill="#ccfbf1"/>
      <path d="M20 21h12M20 26h12M20 31h8" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
      <text x="20" y="60" fill="#0f172a" font-size="15" font-weight="700">Ingest + chunk</text>
      <text x="20" y="76" fill="#64748b" font-size="12">Prepare passages</text>
    </g>
    <g transform="translate(645 128)">
      <rect width="145" height="84" rx="16" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="26" cy="26" r="14" fill="#ede9fe"/>
      <circle cx="21" cy="25" r="2" fill="#6d28d9"/>
      <circle cx="31" cy="21" r="2" fill="#6d28d9"/>
      <circle cx="30" cy="32" r="2" fill="#6d28d9"/>
      <path d="m23 24 6-2m-7 4 7 5" stroke="#6d28d9" stroke-width="1.5"/>
      <text x="20" y="60" fill="#0f172a" font-size="15" font-weight="700">Embeddings</text>
      <text x="20" y="76" fill="#64748b" font-size="12">Sentence Transformer</text>
    </g>
    <g transform="translate(945 128)">
      <rect width="120" height="84" rx="16" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="26" cy="26" r="14" fill="#ffedd5"/>
      <path d="M20 22h12v9H20zM23 19v3m6-3v3m-6 12v-3m6 3v-3" fill="none" stroke="#c2410c" stroke-width="1.5"/>
      <text x="20" y="60" fill="#0f172a" font-size="15" font-weight="700">ChromaDB</text>
      <text x="20" y="76" fill="#64748b" font-size="12">Vector index</text>
    </g>
    <g transform="translate(45 299)">
      <rect width="145" height="84" rx="16" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="26" cy="26" r="14" fill="#dbeafe"/>
      <path d="M19 23h14v9H19zM22 20h8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
      <text x="20" y="60" fill="#0f172a" font-size="15" font-weight="700">Ask</text>
      <text x="20" y="76" fill="#64748b" font-size="12">Streamlit + FastAPI</text>
    </g>
    <g transform="translate(345 299)">
      <rect width="145" height="84" rx="16" fill="url(#blue)"/>
      <circle cx="26" cy="26" r="14" fill="#fff" fill-opacity=".2"/>
      <path d="M19 26h14m-7-7v14m-5-12 10 10m0-10L21 31" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="20" y="60" fill="#fff" font-size="15" font-weight="700">Role filter</text>
      <text x="20" y="76" fill="#e0f2fe" font-size="12">Allowed departments</text>
    </g>
    <g transform="translate(645 299)">
      <rect width="145" height="84" rx="16" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="26" cy="26" r="14" fill="#fce7f3"/>
      <path d="M20 25c0-4 12-4 12 0v7H20zM22 22c1-3 7-3 8 0" fill="none" stroke="#be185d" stroke-width="1.5"/>
      <text x="20" y="60" fill="#0f172a" font-size="15" font-weight="700">Groq</text>
      <text x="20" y="76" fill="#64748b" font-size="12">Generate answer</text>
    </g>
    <g transform="translate(945 299)">
      <rect width="145" height="84" rx="16" fill="#fff" stroke="#cbd5e1"/>
      <circle cx="26" cy="26" r="14" fill="#ccfbf1"/>
      <path d="M19 21h14M19 26h10M19 31h7" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
      <text x="20" y="60" fill="#0f172a" font-size="15" font-weight="700">Cited answer</text>
      <text x="20" y="76" fill="#64748b" font-size="12">Answer + sources</text>
    </g>
  </g>
  <text x="48" y="423" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">Document context is filtered by role before it is sent to the language model.</text>
</svg>
